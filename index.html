<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestor de Aula ATECA</title>
    <link rel="icon" type="image/png" href="/logo_iesb.png" />
    <script>
      (function() {
        try {
          var target = typeof globalThis !== 'undefined' ? globalThis : window;
          var originalFetch = target.fetch;
          var currentFetch = originalFetch;
          Object.defineProperty(target, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn("Fetch polyfill patch warnings: ", e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
